apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels: {{- include "ferrum.labels" (dict "root" . "name" "worker") | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: worker, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {{- include "ferrum.labels" (dict "root" . "name" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      # SIGTERM drains in-flight deliveries (a few seconds); the worker takes no inbound traffic, so no preStop sleep.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- include "ferrum.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "ferrum.image" (dict "root" . "name" .Values.image.workerName) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.worker.port }}}]
          envFrom: [{configMapRef: {name: {{ .Release.Name }}-config}}]
          env:
            {{- include "ferrum.dbEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          startupProbe:  {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe:  {httpGet: {path: /healthz, port: http}, periodSeconds: 10}   # consumer, relay and scheduler heartbeats
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  labels: {{- include "ferrum.labels" (dict "root" . "name" "worker") | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: worker, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.worker.port }}, targetPort: http}]
