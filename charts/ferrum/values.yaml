# Ferrum application chart. Infrastructure (Postgres, Redis, Jaeger/OTLP) is NOT part of this chart:
# point it at them below. Secrets are never created here; reference pre-existing Secrets.

image:
  registry: ghcr.io
  organization: ferrum-local          # ghcr.io/<organization>/<name>:<tag>
  gatewayName: gateway
  workerName: worker
  tag: latest                         # use an immutable tag (git SHA); never reuse a tag
  pullPolicy: IfNotPresent
  pullSecrets: []                     # e.g. [{name: ghcr-secret}]

database:
  host: postgres
  port: 5432
  name: ferrum_db
  user: ferrum_user
  passwordSecret: {name: postgres-secret, key: DB_PASSWORD}

redis:
  host: redis
  port: 6379

auth:
  jwtSecret: {name: ferrum-secret, key: JWT_SECRET}     # >= 32 characters
  jwtTtlSeconds: 3600

tracing:
  endpoint: http://jaeger:4318        # "" disables export (spans/trace ids still created)
  samplerRatio: "0.1"

security:
  allowPrivateWebhookTargets: false   # true disables the SSRF guard: tests only
  allowInsecureWebhooks: true         # false => https targets only

rateLimit:
  capacity: 100
  refillPerSecond: 50
  authCapacity: 20
  authRefillPerSecond: 2

delivery:
  maxAttempts: 5
  retryBaseSeconds: 5
  workerConcurrency: 8

migrations:
  enabled: true                       # Helm hook Job: runs before every install/upgrade
  backoffLimit: 4

gateway:
  replicas: 2
  port: 8000
  service: {type: ClusterIP, nodePort: null}
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 10
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: 500m, memory: 384Mi}     # sized for Argon2: do not lower below ~256Mi
  autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 5, targetCPUUtilizationPercentage: 70}
  pdb: {enabled: true, minAvailable: 1}

worker:
  replicas: 1
  port: 8001
  terminationGracePeriodSeconds: 30
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
  autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 5, targetCPUUtilizationPercentage: 70}
  pdb: {enabled: true, minAvailable: 1}

podAnnotations: {}
extraEnv: []                          # [{name: X, value: "y"}] applied to gateway and worker
