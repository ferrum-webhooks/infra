# TEMPLATE. Do not put real values in this file or commit a filled-in copy.
# Preferred: generate real secrets with ./create-secrets.sh (random values, applied straight to the cluster).
# Manual alternative: copy to postgres-secret.yaml (git-ignored), replace every CHANGE_ME, then `kubectl apply -f`.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ferrum
type: Opaque
stringData:
  POSTGRES_USER: postgres              # superuser, used only to create the application role
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: postgres
  DB_USER: ferrum_user                 # application role created by the init script on FIRST start of the volume
  DB_PASSWORD: CHANGE_ME
  DB_NAME: ferrum_db
