apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ferrum
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: ghcr.io/${GITHUB_ORG}/worker:${IMAGE_TAG}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: ferrum-config
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: DB_PASSWORD}}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz        # consumer/relay/scheduler heartbeats, not just 'metrics server is up'
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 8001
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: ferrum
spec:
  selector:
    app: worker
  ports:
    - port: 8001
      targetPort: 8001