# Trace backend for local/dev: Jaeger all-in-one (in-memory). OTLP/HTTP in on 4318, UI on 16686.
# Replaced by an OpenTelemetry Collector + durable backend in Project 3.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: ferrum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
            - containerPort: 4318
          readinessProbe:
            httpGet: {path: /, port: 16686}
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits: {cpu: "1", memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: ferrum
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - {name: ui, port: 16686, targetPort: 16686, nodePort: 30686}
    - {name: otlp-http, port: 4318, targetPort: 4318}
