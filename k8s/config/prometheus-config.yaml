apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ferrum
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:

      - job_name: 'gateway'
        metrics_path: /metrics
        static_configs:
          - targets: ['gateway:8000']

      - job_name: 'worker'
        metrics_path: /metrics
        static_configs:
          - targets: ['worker:8001']